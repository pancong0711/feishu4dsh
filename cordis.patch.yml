# Bundle patch applied over the selected DSH profile when this package is
# listed in `dsh.profile.bundles`. The row id is deployment-local; the package
# name must match package.json.

# 宿主模型面行让位给 agent preset 层（对照 dsh-web-app/cordis.patch.yml，
# 0.2.0 口径：24 条 disable 行）：
# 本文件的 disable 行是各 face 行的整行替换，工具与提示面改由 agent preset
# 组合按会话挂载提供；宿主保留行（tools 注册表、fs/沙箱/审批、subagent 注册表
# 与 backends、goals/tasks 宿主面、shell-env、token-meter、session 持久化等）
# 一律不动。dsh 0.2.0 起预设由 `agent-preset-registry` + 每预设一条
# `@deepseek-ai/dsh-agent-preset` 声明提供（见文件末尾）。

- insert:
    # Agent preset roster (R38): the per-session composition layer web
    # entrances get from the dsh-web-app bundle. Without this row the
    # `agentPresets.mount` service does not exist and bridge sessions run on
    # the host-plane rows below — i.e. presets never take effect.
    - id: feishu4dsh
      name: 'feishu4dsh'
      config:
        # Credentials layering: these entry values (env via `!!js`, never
        # `!js`) -> the user settings document.
        appId: !!js process.env.FEISHU_APP_ID
        appSecret: !!js process.env.FEISHU_APP_SECRET

        # 域名：feishu（国内，默认）或 lark（国际版）
        # domain: lark

        # 传输模式：websocket（长连接，默认，无需公网地址）或 webhook
        # connectionMode: websocket
        # webhook 模式才需要的两个值（飞书开放平台「事件与回调 -> 加密策略」）：
        # verificationToken: !!js process.env.FEISHU_VERIFICATION_TOKEN
        # encryptKey: !!js process.env.FEISHU_ENCRYPT_KEY
        # webhookPort: 3081

        # 工作目录：agent 会话的默认工作区（默认宿主进程 cwd）
        # workspace: /absolute/path/to/workspace

        # /cd 可进入的目录前缀；留空 = 仅允许默认工作区与已注册工作区（安全默认）
        # workspaceRoots: ['/absolute/path/to/projects']

        # 会话粒度：chat（默认，整个聊天一个会话）、chat-thread（按话题）、
        # chat-sender（按发送人）
        sessionScope: chat-thread

        # 群聊是否需要 @ 机器人才响应（默认 true）
        requireMention: true

        # 输出呈现：stream（默认，一段流式文本）或 card（单卡片聚合过程与答案）
        # output: stream
        # 是否在回复卡片/文本中展示工具调用过程
        # showProcess: true

        # 媒体收发
        # receiveFiles: true                    # 入站文件/图片落入 <workspace>/.feishu4dsh/inbox/
        # maxReceiveFileBytes: 20971520         # 单文件上限
        # maxMessageReceiveBytes: 1073741824    # 单条消息附件总大小上限（1 GiB）
        # saveImagesToInbox: true               # 图片是否也保存到工作区 inbox
        # attachImages: false                   # 仅确认模型支持视觉时开启
        # sendFiles: true                       # 群聊发送前始终弹审批卡片
        # maxSendFileBytes: 20971520

        # 审批（工具调用授权）：超时未点击按拒绝处理（fail-closed）
        # approvalTimeoutMs: 300000

        # 界面语言：auto（跟随飞书客户端语言）/ zh-CN / en-US
        # locale: auto

        # 授权收窄（只收窄、不放行）：谁能找到机器人由应用「可用范围」决定，
        # 这里可以进一步限制。留空 = 服务所有能见到机器人的人。
        # senderAllowlist: []      # 私聊发送人 open_id 列表
        # groupAllowlist: []       # 群聊 chat_id 列表
        # approvers: []            # 可点击「允许/拒绝」按钮的 open_id；留空 = 谁驱动会话谁审批

# ── agent plane moves behind agent presets (mirrors dsh-web-app) ────────────
# Same rows, same mechanism as the web bundle: the base keeps these model-face
# rows for the single-session TUI-style composition, a channel that composes
# one agent per session disables them here and joins every agent to a preset
# instead (`agentPresets.mount` inside the setup). Patch semantics replace a
# row's whole entry by id, so `id + disabled: true` is enough to retire the
# host-plane row. Verify the counterpart list against the installed
# `@deepseek-ai/dsh-web-app/cordis.patch.yml` when dsh upgrades.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane (`jobs` row); only the
# model-facing job_* controls move behind presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY (`skill` row) stays in the host plane; only the
# per-agent rows — local skill discovery and the model-facing skill tool — move.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane; the human
# command and the model-facing tool own the preset layer.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane (`subagent`
# and `subagent-*-in-process` rows); only the delegation TOOLS move.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-plugin-manager
  disabled: true

- id: tool-web
  disabled: true

# ── dsh 0.2.0 preset roster + shipped declarations ──────────────────────────
# 0.2.0 replaced `@deepseek-ai/dsh-agent-presets` (a package that shipped preset
# directories) with two pieces: the registry service row below, and one
# `@deepseek-ai/dsh-agent-preset` declaration per preset (plugins listed inline).
# The plugin ships `standard` / `minimal` as factory defaults so a bare install
# works; a deployment's profile patch may override either declaration by the same
# row id (later patch layers win), which is how per-deployment edits are kept.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

# preset `standard` — the full coding-agent composition (factory default;
# a profile-layer row with id `preset-standard` overrides this one).
- insert:
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

# ── 0.2.0 agent-preset declaration: minimal.patch.yml ───────────────────────────
# Agent preset minimal: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.

# preset `minimal` — persistent shell only, no runtime-context injection
# (factory default; a profile-layer row with id `preset-minimal` overrides it).
- insert:
    - id: preset-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minimal
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: true
              includeRuntimeContext: false
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * State is persistent across command calls and discussions with the user.
                    * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.
